<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070d18" />
    <title>Загрузить фото</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans:wght@400;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="join-page">
    <header class="join-bar">
      <a class="brand" href="./"><span class="brand-mark"></span><span data-i="brand">Аквариум</span></a>
    </header>

    <main id="app" class="join-phone">
      <h1 data-i="joinTitle">Сфотографируй рисунок</h1>
      <p class="join-which" data-i="joinWhich">Какую рыбку раскрасил?</p>
      <div class="join-picks" id="picks"></div>
      <div class="join-tips" data-i="joinTips" data-i-html></div>
      <p class="join-hint" data-i="joinHint"></p>
      <label class="gold join-upload">
        <span data-i="joinUpload">Загрузить фото</span>
        <input id="photo" type="file" accept="image/*,image/jpeg,image/png,image/heic,image/heif,image/webp" />
      </label>
      <p class="success" id="success" data-i="joinOk"></p>
    </main>

    <script type="module" src="/src/join-page.js"></script>
  </body>
</html>
