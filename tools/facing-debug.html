<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { background: #101820; color: #dfe; font: 12px monospace; padding: 8px; }
      .row { margin-bottom: 8px; }
      canvas { background: #223; image-rendering: pixelated; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module">
      import { loadImage } from "/src/templates-data.js";
      import { cutOutFish } from "/src/cutout.js";
      import { silhouette, facingSignals } from "/src/fish-facing.js";

      const FILES = ["angel.jpg", "perch.jpeg", "puffer.png", "carp.webp"];
      const out = document.getElementById("out");

      function mirror(img) {
        const c = document.createElement("canvas");
        c.width = img.naturalWidth || img.width;
        c.height = img.naturalHeight || img.height;
        const ctx = c.getContext("2d");
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0);
        return c;
      }

      function draw(shape) {
        const { mask, w, h } = shape;
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        const id = ctx.createImageData(w, h);
        for (let i = 0; i < w * h; i++) {
          const on = mask[i];
          id.data[i * 4] = on ? 120 : 20;
          id.data[i * 4 + 1] = on ? 220 : 30;
          id.data[i * 4 + 2] = on ? 180 : 45;
          id.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(id, 0, 0);
        c.style.height = "90px";
        return c;
      }

      function spanText(shape) {
        const { mask, w, h } = shape;
        const vals = [];
        for (let b = 0; b < 20; b++) {
          const x0 = Math.floor((b * w) / 20);
          const x1 = Math.max(x0 + 1, Math.floor(((b + 1) * w) / 20));
          let best = 0;
          for (let x = x0; x < x1; x++) {
            let lo = -1, hi = -1;
            for (let y = 0; y < h; y++) if (mask[y * w + x]) { if (lo < 0) lo = y; hi = y; }
            if (lo >= 0) best = Math.max(best, (hi - lo + 1) / h);
          }
          vals.push(best.toFixed(2));
        }
        return vals.join(" ");
      }

      for (const file of FILES) {
        const raw = await loadImage(`/fish/${file}`);
        const cut = await loadImage(cutOutFish(raw));
        for (const [tag, img] of [["cutout", cut], ["mirrored", mirror(cut)]]) {
          const shape = silhouette(img);
          const s = facingSignals(img);
          const div = document.createElement("div");
          div.className = "row";
          div.innerHTML = `<b>${file} ${tag}</b> ${shape.w}x${shape.h} waist=${s.waist.toFixed(3)} fork=${s.fork.toFixed(3)} solid=${s.solid.toFixed(3)}<br>span: ${spanText(shape)}<br>`;
          div.appendChild(draw(shape));
          out.appendChild(div);
        }
      }
      document.title = "READY";
    </script>
  </body>
</html>
